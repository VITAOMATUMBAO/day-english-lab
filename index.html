<style>:root{color-scheme:light dark}html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: deep-teal header band with a sun-orange accent, pill tabs, one centered column; cards lifted with soft shadow, a journey track from A1 to C1. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --ink:#0F1F1D; --muted:#586966; --line:#D8E2DF;
  --deep:#0B3B3A; --deep2:#14544F; --on-deep:#F1FAF7; --on-deep-muted:#A9CBC4;
  --sun:#F4A63B; --sun-ink:#2B1A00;
  --accent:#12806A; --accent-ink:#FFFFFF; --soft:#DDEFE9;
  --warn:#935A0B; --warn-soft:#FBEBCB; --bad:#A63A2A; --bad-soft:#F8DFDA; --good:#1F7544; --good-soft:#D8F0E1;
  --shadow:0 1px 2px rgba(11,59,58,.06),0 6px 18px rgba(11,59,58,.07);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1211; --surface:#122220; --ink:#E7F2EF; --muted:#8FA8A2; --line:#22392F;
    --deep:#07201F; --deep2:#0E3B37; --on-deep:#EAF7F3; --on-deep-muted:#8DB5AD;
    --sun:#F4A63B; --sun-ink:#2B1A00;
    --accent:#4FCBAA; --accent-ink:#06211B; --soft:#173A33;
    --warn:#E8B054; --warn-soft:#3B2D14; --bad:#EE8B7B; --bad-soft:#3D2420; --good:#6FD39A; --good-soft:#173525;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1211; --surface:#122220; --ink:#E7F2EF; --muted:#8FA8A2; --line:#22392F;
  --deep:#07201F; --deep2:#0E3B37; --on-deep:#EAF7F3; --on-deep-muted:#8DB5AD;
  --sun:#F4A63B; --sun-ink:#2B1A00;
  --accent:#4FCBAA; --accent-ink:#06211B; --soft:#173A33;
  --warn:#E8B054; --warn-soft:#3B2D14; --bad:#EE8B7B; --bad-soft:#3D2420; --good:#6FD39A; --good-soft:#173525;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(135deg,var(--deep),var(--deep2));color:var(--on-deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:26px;height:26px}
h1{font:800 1.65rem/1 var(--f-display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--sun)}
.sub{color:var(--on-deep-muted);font-size:.82rem;margin:3px 0 0}
.count{font:500 .78rem var(--f-mono);color:var(--on-deep-muted);text-align:right;line-height:1.3}
.count b{display:inline;margin-right:4px;font:800 1.1rem/1 var(--f-display);color:var(--sun);letter-spacing:-.02em}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;padding:8px 14px;color:var(--on-deep-muted);text-decoration:none;font-weight:600;font-size:.9rem;border-radius:999px;border:1px solid transparent}
nav a:hover{color:var(--on-deep)}
nav a[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}
a:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
main{padding-block:22px 64px;display:grid;gap:24px}
section[hidden]{display:none}
section{display:grid;gap:18px;align-content:start}
h2{font:700 1.3rem/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 1rem/1.3 var(--f-body);margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--deep),var(--deep2));color:var(--on-deep);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0,transparent 68%);opacity:.38;pointer-events:none}
.hero .kicker{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.hero h2{color:var(--on-deep);font-size:1.6rem;margin:6px 0 8px;position:relative}
.hero p{margin:0 0 6px;color:var(--on-deep-muted);position:relative;max-width:60ch}
.hero .due{display:inline-block;margin-top:8px;font:500 .78rem var(--f-mono);background:rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;color:var(--on-deep)}
.hero .min{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);color:var(--on-deep);font-size:.92rem}
.theme>summary,.topic>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;cursor:pointer;list-style:none}.theme{border:1px solid var(--line,#2a4a46);border-radius:16px;background:rgba(255,255,255,.03)}.topic{border:1px solid rgba(255,255,255,.08);border-radius:12px}.theme>summary .t{font-weight:800;font-size:1.05rem}.topic>summary .t{font-weight:700}.tin{padding:0 10px 10px}
.corr{margin:12px 0;padding:12px;border-radius:12px;border:1px solid var(--line,#2a4a46);background:rgba(61,214,177,.07)}.corr h4{margin:0 0 6px}.ci{padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}.ci.ok .cq{color:#3dd6b1}.ci.no .cq{color:#f4a63b}.cq{font-weight:600}

.back{display:inline-block;margin:0 0 14px;font-weight:700;color:var(--accent);text-decoration:none}
.sect{margin:22px 0 10px;font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:10px}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.rl-main{min-width:0}.rl-title{font-weight:650;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}.rl-date{font-size:.78rem;color:var(--muted);margin-bottom:2px}
.chev{font-size:1.6rem;color:var(--muted);line-height:1}
.month{margin:18px 0 2px;font:700 .8rem var(--f-body);color:var(--muted)}
.more{width:100%;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:block;padding:20px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);min-height:118px}
.tile-n{font:800 2rem/1 var(--f-display);color:var(--accent)}.tile-t{font-weight:700;margin-top:8px}.tile-s{font-size:.8rem;color:var(--muted);margin-top:2px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow)}
.detail .body{display:grid;gap:18px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.detail .body p{margin:0}
#a-q{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;box-sizing:border-box}

.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.mcard{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:8px}
.mcard.mfx{opacity:.75}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mpat{display:inline-block;font:700 .72rem var(--f-body);letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:rgba(244,166,59,.15);color:var(--sun,#f4a63b)}
.mwrong{font-weight:650;color:#f08a7a;text-decoration:line-through;text-decoration-thickness:1px;overflow-wrap:anywhere}
.mright{font-weight:650;color:#3dd6b1;overflow-wrap:anywhere}
.kicker2{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bigline{font-size:1.05rem;margin:4px 0 2px}.bigline b{font-size:2rem;color:var(--accent);margin-right:2px}
.mot{margin:2px 0 10px;font-weight:600}
.jr{margin-top:10px}.jr-h{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;margin-bottom:4px}.jr-h span{min-width:0}
.sub2{opacity:.8}
.aussie{border-left:4px solid var(--sun)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.stat .n{font:800 1.5rem/1 var(--f-display);letter-spacing:-.02em}
.stat .l{font-size:.74rem;color:var(--muted);margin-top:6px}
.strip{display:flex;gap:5px;flex-wrap:wrap}
.strip i{width:24px;height:30px;border-radius:7px;background:var(--line);display:block}
.strip i.on{background:linear-gradient(180deg,var(--accent),var(--deep2))}
.strip i.today{outline:2px solid var(--sun);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--line);vertical-align:-1px}
.legend span.on::before{background:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;font:600 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.pill{display:inline-block;font:500 .72rem var(--f-mono);padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-done{background:var(--good-soft);color:var(--good)}
.p-partial{background:var(--warn-soft);color:var(--warn)}
.p-pending{background:var(--bad-soft);color:var(--bad)}
.p-planned,.p-marked{background:var(--soft);color:var(--accent)}
.p-neutral{background:var(--line);color:var(--muted)}
details.act{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
details.act[open]{border-color:var(--accent)}
details.act summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
details.act summary::-webkit-details-marker{display:none}
.act .date{font:500 .75rem var(--f-mono);color:var(--muted)}
.act .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.act .body{padding:14px 16px 16px;display:grid;gap:12px;border-top:1px solid var(--line)}
.act .body p{margin:0}
.kv{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.kv span{background:var(--bg);padding:4px 9px;border-radius:8px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn{font:600 .92rem var(--f-body);padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.btn.sun{background:var(--sun);color:var(--sun-ink)}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=number],input[type=search],input[type=text]{width:100%;font:400 1rem/1.45 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
input[type=number]{width:96px}
label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px}
a{color:var(--accent)}
.journey{position:relative;margin:34px 0 10px}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.track div{padding:10px 4px;text-align:center;font:600 .78rem var(--f-mono);color:var(--muted);background:var(--line);border-radius:8px}
.track div small{display:block;font-weight:400;font-size:.66rem;margin-top:2px}
.track div.t6{background:var(--warn-soft);color:var(--warn)}
.track div.t7{background:var(--good-soft);color:var(--good)}
.track div.here{box-shadow:inset 0 -4px 0 var(--sun)}
.mark{position:absolute;top:-30px;transform:translateX(-50%);text-align:center;font:500 .72rem var(--f-mono);white-space:nowrap}
.mark b{background:var(--sun);color:var(--sun-ink);padding:3px 8px;border-radius:6px;font-weight:600}
.mark::after{content:"";display:block;width:2px;height:22px;background:var(--sun);margin:2px auto 0}
.skill{display:grid;gap:7px;padding:14px 0;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0;padding-top:4px}
.skill .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rail{position:relative;height:10px;background:var(--line);border-radius:5px}
.rail .fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--deep2));border-radius:5px;min-width:7px}
.rail.none{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);border:1px dashed var(--line)}
.rail .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--sun)}
.dots{width:100%;height:auto;display:block;overflow:visible}
.dots text{fill:var(--muted);font:10px var(--f-mono)}
.dots line{stroke:var(--line)}
.err{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.ex{font-family:var(--f-mono);font-size:.82rem;background:var(--bg);padding:7px 10px;border-radius:8px;overflow-wrap:anywhere}
.ex .no{color:var(--bad);text-decoration:line-through}
.ex .ok{color:var(--good)}
.feed{display:grid;margin:0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .d{font:500 .78rem var(--f-mono);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px}
.status-line{font-size:.8rem;color:var(--muted)}
/* translator */
.tr-box{display:grid;gap:12px}
.tr-out{display:grid;gap:8px;background:var(--soft);border-radius:14px;padding:16px}
.tr-out .big{font:700 1.4rem/1.25 var(--f-display);overflow-wrap:anywhere}
.tr-out .lang{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.words{display:grid;gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;box-shadow:var(--shadow)}
.word .en{font-weight:700;font-family:var(--f-display);font-size:1.05rem;overflow-wrap:anywhere}
.word .pt{color:var(--muted);overflow-wrap:anywhere}
.word .ex2{grid-column:1/-1;font-size:.85rem;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.word.learned{opacity:.65}
.icon-btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font:600 .8rem var(--f-body);cursor:pointer}
.big-q{font:700 1.5rem/1.2 var(--f-display);overflow-wrap:anywhere}
.fbk{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
@media (max-width:520px){
  h1{font-size:1.4rem}
  .hero h2{font-size:1.35rem}
  .feed li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.lesson{display:grid;gap:12px;margin:10px 0}.lblock{border:1px solid var(--line,#d5e3df);border-radius:14px;padding:12px;background:var(--card2,transparent)}.lblock h4{margin:0 0 6px;font-size:15px}.exrow{display:grid;gap:6px;margin:10px 0}.exrow input{width:100%}.exn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent,#12806A);color:#fff;font-size:12px;margin-right:6px}.tx{margin-top:8px}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
        <div>
          <h1>G'day <span>Lab</span></h1>
          <p class="sub">Vitor's English route to Australia · v29</p>
        </div>
      </div>
      <div class="count" id="count" aria-live="polite"></div>
      <button id="reload" type="button" aria-label="Update the app" style="background:var(--sun);color:var(--sun-ink);border:0;border-radius:999px;padding:8px 14px;font:700 .85rem var(--f-body);cursor:pointer">&#8635; Update</button>
    </div>
    <nav aria-label="Sections" id="tabs">
      <a href="#today" data-tab="today">Today</a>
      <a href="#activities" data-tab="activities">Activities</a>
      <a href="#translator" data-tab="translator">Translator</a>
      <a href="#level" data-tab="level">Level</a>
      <a href="#mistakes" data-tab="mistakes">Mistakes</a>
      <a href="#log" data-tab="log">Log</a>
      <a href="#settings" data-tab="settings">Settings</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status-line" id="conn" role="status"></div>
  <section id="s-today" aria-label="Today"></section>
  <section id="s-activities" aria-label="Activities" hidden></section>
  <section id="s-translator" aria-label="Translator" hidden></section>
  <section id="s-level" aria-label="Level" hidden></section>
  <section id="s-mistakes" aria-label="Mistakes" hidden></section>
  <section id="s-log" aria-label="Log" hidden></section>
  <section id="s-settings" aria-label="Settings" hidden></section>
</main>

<script>
(function(){
  var S = {act:[],scores:[],errs:[],feed:[],words:[],attempts:[],mis:[],usage:null,meta:null,prof:null,loaded:{}};
  var db = null, filter = 'open', wfilter = 'all', wquery = '', trBusy = false, trResult = null, trError = '';
  var CAP = 30, STEPS = [1,3,7,14,30], fb = {}, fbBusy = {}, rvMsg = null, clearIds = {};
  var TABS = ['today','activities','translator','level','mistakes','log','settings'];
  var ST = {
    done:['Corrected','p-done'], partial:['Partly done','p-partial'], pending:['No reply yet','p-pending'],
    planned:['Planned','p-planned'], marked:['Sent by you','p-marked'], skipped:['Skipped','p-neutral']
  };
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

    }
    var h='<h2>My mistakes</h2><div class="tiles3"><div class="stat"><div class="n">'+toFix.length+'</div><div class="l">to fix</div></div><div class="stat"><div class="n">'+fixed+'</div><div class="l">fixed</div></div><div class="stat"><div class="n">'+S.errs.length+'</div><div class="l">patterns</div></div></div>';
    if(toFix.length) h+='<button class="btn sun" data-act="pm-start" style="width:100%;margin-top:14px;padding:16px">Practice '+Math.min(5,toFix.length)+' mistakes now</button>';
    var pats={}; all.forEach(function(m){ if(!m.fixed||mfilter!=='fix') pats[m.pattern]=(pats[m.pattern]||0)+1 });
    h+='<div class="chips" style="margin-top:16px">'+[['fix','To fix'],['done','Fixed'],['all','All']].map(function(c){return '<button class="chip" data-mf="'+c[0]+'" aria-pressed="'+(mfilter===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>';
    var pk=Object.keys(pats).sort(function(a,b){return pats[b]-pats[a]});
    if(pk.length>1) h+='<div class="chips" style="margin-top:10px"><button class="chip" data-mp="" aria-pressed="'+(!mpat)+'">All patterns</button>'+pk.map(function(k){return '<button class="chip" data-mp="'+esc(k)+'" aria-pressed="'+(mpat===k)+'">'+esc(k)+' · '+pats[k]+'</button>'}).join('')+'</div>';
    var list=all.filter(function(m){ return (mfilter==='all'||(mfilter==='fix'?!m.fixed:m.fixed)) && (!mpat||m.pattern===mpat) }).sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')) });
    h+='<div class="list" style="margin-top:14px">'+(list.length?list.slice(0,mshow).map(mCard).join(''):'<div class="empty">'+(mfilter==='fix'?'Nothing to fix. Great work.':'Nothing here yet.')+'</div>')+'</div>';
    if(list.length>mshow) h+='<button class="btn ghost more" data-act="mmore">Show '+(list.length-mshow)+' more</button>';
    var ers=S.errs.slice(), rank={active:0,improving:1,fixed:2}; ers.sort(function(a,b){return (rank[a.status]||0)-(rank[b.status]||0)});
    var lab={active:'Still happening',improving:'Getting better',fixed:'Fixed'};
    if(ers.length) h+='<details class="theme" style="margin-top:22px"><summary style="padding:16px;cursor:pointer;font-weight:700">Pattern rules ('+ers.length+')</summary><div class="list" style="padding:0 12px 12px">'+ers.map(function(e){
      var pc=e.status==='fixed'?'p-done':(e.status==='improving'?'p-partial':'p-pending');
      return '<div class="err"><div class="row" style="justify-content:space-between"><h3 style="margin:0">'+esc(e.name)+'</h3><span class="pill '+pc+'">'+(lab[e.status]||'')+'</span></div>'+(e.wrong?'<div class="ex"><span class="no">'+esc(e.wrong)+'</span>'+(e.right?' &rarr; <span class="ok">'+esc(e.right)+'</span>':'')+'</div>':'')+(e.rule?'<div class="small">'+esc(e.rule)+'</div>':'')+'</div>' }).join('')+'</div></details>';
    return h;
  }

  function vLog(){
    var list=S.feed.slice().sort(function(a,b){return String(b.order||b.date).localeCompare(String(a.order||a.date))});
    var h='<h2>Log</h2>';
    if(!list.length) return h+'<div class="empty">Nothing here yet.</div>';
    return h+'<div class="panel"><ul class="feed">'+list.map(function(f){return '<li><div class="d">'+fmt(f.date)+'</div><div>'+esc(f.text)+'</div></li>'}).join('')+'</ul></div>';
  }


  function vSettings(){
    function f(id,label,val,ph,type){ return '<div><label for="'+id+'">'+label+'</label><input type="'+(type||'text')+'" id="'+id+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' }
    return '<h2>Settings</h2><div class="card stack">'+
      '<p class="small muted">These keys stay only on this device. Never put them in the code.</p>'+
      f('cfg-repo','GitHub repository (owner/name)',CFG.repo||DEF_REPO,DEF_REPO)+
      f('cfg-token','GitHub token (needs read and write on Contents of this repository)',CFG.token,'github_pat_...','password')+
      f('cfg-gemini','Gemini API key',CFG.gemini,'AIza...','password')+
      f('cfg-model','Gemini model',CFG.model||DEF_MODEL,DEF_MODEL)+
      '<div class="row"><button class="btn sun" data-act="cfg-save">Save settings</button><button class="btn ghost" data-act="cfg-test">Test connection</button></div>'+
      '<div class="small" id="cfg-msg" role="status">'+esc(cfgMsg)+'</div></div>';
  }
  var cfgMsg='';

  /* ---------- render ---------- */
  function route(){ var t=(location.hash||'#today').slice(1).split('/')[0]; return TABS.indexOf(t)>-1?t:'today' }
  function render(){
    var ui=snapshotUI(), t=route();
    TABS.forEach(function(k){ if(k!==t && $('s-'+k)) $('s-'+k).innerHTML='' });
    TABS.forEach(function(k){ $('s-'+k).hidden = (k!==t) });
    document.querySelectorAll('#tabs a').forEach(function(a){ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current') });
    var el=$('s-'+t);
    el.innerHTML = t==='today'?vToday(): t==='activities'?vActivities(): t==='translator'?vTranslator(): t==='level'?vLevel(): t==='mistakes'?vMistakes(): t==='settings'?vSettings(): vLog();
    restoreUI(ui);
    $('count').innerHTML='<b>'+daysTo('2028-09-01')+'</b>days to Sep 2028';
    if(!db && !S.loaded.act && !$('conn').textContent) $('conn').textContent='Loading your data…';
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b){ var al=e.target.closest('a[data-act="pm-stop"]'); if(al){ e.preventDefault(); pm=null; render(); } return; }
    if(b.dataset.filter){ filter=b.dataset.filter; render(); return; }
    if(b.dataset.act==='showall'){ showAll[b.dataset.key]=1; render(); return; }
    if(b.dataset.wfilter){ wfilter=b.dataset.wfilter; render(); return; }
    if(b.dataset.mf){ mfilter=b.dataset.mf; mshow=10; render(); return; }
    if(b.dataset.mp!==undefined && b.hasAttribute('data-mp')){ mpat=b.dataset.mp; mshow=10; render(); return; }
    if(act==='mmore'){ mshow+=15; render(); return; }
    if(act==='mfix'){
      var mm=allMistakes().find(function(x){return x.id===id}); if(!mm) return;
      var mi=$('mi-'+id), ans=(mi&&mi.value||'').trim(); if(!ans){ toast('Write your correction first.',3000); return; }
      var gd=isGood(mm,ans); mMsg[id]=gd?'':(mm.tries>=1?'Not yet. The answer is: '+mm.right:'Not yet. Read the hint and try once more.');
      b.disabled=true; persistMistake(mm,ans,gd).then(function(ok){ if(ok!==false&&gd) toast('Correct! Fixed.',2200); render() }); return;
    }
    if(act==='pm-start'){
      var tf=allMistakes().filter(function(m){return !m.fixed}); for(var q=tf.length-1;q>0;q--){ var j=Math.floor(Math.random()*(q+1)), t=tf[q]; tf[q]=tf[j]; tf[j]=t }
      pm={ids:tf.slice(0,5).map(function(m){return m.id}),i:0,good:0,msg:'',done:false,hint:false}; render(); return;
    }
    if(act==='pm-stop'){ pm=null; render(); return; }
    if(act==='pm-hint'){ pm.hint=true; render(); return; }
    if(act==='pm-skip'||act==='pm-next'){ pm.i++; pm.msg=''; pm.done=false; pm.hint=false; render(); return; }
    if(act==='pm-check'){
      var cm=allMistakes().find(function(x){return x.id===pm.ids[pm.i]}), pin=$('pm-in'), pa=(pin&&pin.value||'').trim(); if(!cm) return;
      if(!pa){ toast('Write your correction first.',3000); return; }
      var pg=isGood(cm,pa); pm.tries=(pm.tries||0)+1;
      if(pg){ pm.good++; pm.msg='Correct! '+cm.right; pm.done=true; persistMistake(cm,pa,true).then(function(){render()}); }
      else if(pm.tries>=2){ pm.msg='Not yet. The answer is: '+cm.right; pm.done=true; pm.tries=0; persistMistake(cm,pa,false).then(function(){render()}); }
      else { pm.msg='Not yet. Try once more (tap Hint if you need the rule).'; render(); }
      if(pg) pm.tries=0;
      return;
    }

    var act=b.dataset.act, id=b.dataset.id;
    if(act==='cfg-save'){
      CFG.repo=($('cfg-repo').value||'').trim()||DEF_REPO; var nt=($('cfg-token').value||'').replace(/\s+/g,''), ng=($('cfg-gemini').value||'').replace(/\s+/g,''); if(nt) CFG.token=nt; if(ng) CFG.gemini=ng; CFG.model=($('cfg-model').value||'').trim()||DEF_MODEL;
      saveCfg(); cfgMsg='Saved on this device.'; loadData().then(function(){ cfgMsg='Saved. Data loaded.'; render() }).catch(function(){ cfgMsg='Saved, but the data could not be loaded. Check the repository name.'; render() }); render(); return;
    }
    if(act==='cfg-test'){
      cfgMsg='Testing… (up to 40 seconds)'; render();
      var out=[];
      fetchT('https://api.github.com/repos/'+repo()+'/contents/data.json',{headers:ghHeaders(false),cache:'no-store'},12000).then(function(r){ out.push('GitHub read: '+(r.ok?'OK':'failed ('+r.status+')')); return fetchT('https://api.github.com/repos/'+repo(),{headers:ghHeaders(false)},12000) }).then(function(r){ return r.json().then(function(j){ out.push('GitHub write access: '+((j.permissions&&j.permissions.push)?'OK':'not confirmed')); }) }).catch(function(){ out.push('GitHub: network error') }).then(function(){
        return ai.json('Reply with JSON only: {"ok":true}').then(function(){ out.push('Gemini: OK') },function(e){ out.push('Gemini: '+aiErr(e)) });
      }).then(function(){ cfgMsg=out.join(' · '); render() });
      return;
    }
    if(act==='translate'){ translate(($('tr-in')||{}).value||''); return; }
    if(act==='speak'){ speak(b.dataset.text||'',Number(b.dataset.rate)||.9); return; }
    if(act==='rec'){ toggleRec(b.dataset.k); return; }
    if(act==='stopspeak'){ try{speechSynthesis.cancel()}catch(e){} try{ if(voiceEl) voiceEl.pause() }catch(e){} return; }
    if(act==='redo' && id){
      var ri=Number(b.dataset.i), ra=S.act.find(function(x){return x.id===id}); if(!ra||!ra.correction) return;
      var it=ra.correction.items[ri], inp2=$('rd-'+id+'-'+ri), ans=(inp2&&inp2.value||'').trim();
      if(!ans){ toast('Write your corrected sentence first.',3000); return; }
      var rdAll=Object.assign({},ra.redo||{}), prev=rdAll[ri]||{}, tries=(prev.tries||0)+1;
      var good=normAns(ans)===normAns(it.right)||(it.alts||[]).some(function(z){return normAns(z)===normAns(ans)});
      rdAll[ri]={ok:good,answer:ans,tries:tries,at:new Date().toISOString()};
      redoMsg[id+'-'+ri]=good?'':(tries>=2?'Not yet. The answer is: '+it.right:'Not yet. Read the rule again and try once more.');
      b.disabled=true;
      saveActivity(id,{redo:rdAll},'Redo: '+(it.q||'')+' => '+ans+' ('+(good?'correct':'wrong')+')','redo').then(function(ok){ if(ok!==false&&good) toast('Correct! Fixed.',2500); render(); });
      return;
    }
    if(act==='check' && id){ checkAnswer(id); return; }
    if((act==='rv-check'||act==='rv-skip') && id){
      var rw=S.words.find(function(x){return x.id===id}); if(!rw||!db) return;
      var inp=($('rv-in')||{}).value||'', td=todayISO();
      if(act==='rv-check' && !inp.trim()) return;
      var good=act==='rv-check' && norm(inp)===norm(rw.english), rev=good?(Number(rw.rev)||0)+1:0;
      clearIds['rv-in']=1;
      rvMsg=good?{ok:true,text:'Correct! '+rw.english}:{ok:false,text:(act==='rv-skip'?'Answer: ':'Not quite. Answer: ')+rw.english};
      db.doc('lookups/'+id).update({rev:rev,lastReview:td,nextReview:good?addDays(td,STEPS[Math.min(rev,4)]):addDays(td,1),learned:good&&rev>=5}).catch(failSave);
      render(); return;
    }
    if(act==='learned' && id){
      var w=S.words.find(function(x){return x.id===id})||{};
      db.doc('lookups/'+id).update({learned:!w.learned}).catch(failSave); return;
    }
    if(act==='send' && id){
      var txt=collectAnswers(id), mn=Number(($('min-'+id)||{}).value)||0;
      var a=S.act.find(function(x){return x.id===id})||{};
      if(!txt.trim()){ toast('Type at least one answer first.',4000); return; }
      b.disabled=true; var oldLbl=b.textContent; b.textContent='Sending…';
      saveActivity(id,{status:'marked',doneAt:new Date().toISOString(),minutes:(Number(a.minutes)||0)+mn,userNote:txt.replace(/\n/g,' | ').slice(0,200)},txt,'answer').then(function(ok){
        b.disabled=false; b.textContent=oldLbl;
        if(ok===false) return;
        toast('Sent! Your answers are saved and your teacher will see them.',6000);
        var t=$('ret-'+id); if(t) t.value=''; render();
      });
    }
    if(act==='skip' && id){
      var why=($('ret-'+id)||{}).value||'';
      b.disabled=true;
      saveActivity(id,{userNote:('I could not do it. '+why).slice(0,200)},'I could not do it. '+why,'help').then(function(){ render() });
    }
  });
  document.addEventListener('input',function(e){
    if(e.target && e.target.id==='w-q'){ wquery=e.target.value; render(); }
    if(e.target && e.target.id==='a-q'){ aquery=e.target.value; render(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.target && e.target.id==='tr-in' && e.key==='Enter' && (e.metaKey||e.ctrlKey)){ translate(e.target.value); }
    if(e.target && e.target.id==='rv-in' && e.key==='Enter'){ var bt=document.querySelector('[data-act="rv-check"]'); if(bt) bt.click(); }
  });
  window.addEventListener('hashchange',function(){ render(); try{ window.scrollTo(0,0) }catch(e){} });

  render();
  $('conn').textContent='Loading your data…';
  document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('#reload'); if(!b) return; b.textContent='Updating…'; try{ if('caches' in window) caches.keys().then(function(ks){ ks.filter(function(k){return k!=='gday-voice'}).forEach(function(k){caches.delete(k)}) }) }catch(x){} setTimeout(function(){ location.replace(location.pathname+'?r='+Date.now()) },250) });
  function sync(){ loadData().then(function(){ $('conn').textContent=''; S.loaded={act:1,scores:1,errs:1,mis:1,feed:1,words:1,attempts:1,meta:1,prof:1} }).catch(function(){ if(!store.data) $('conn').textContent='Could not load your data. Check Settings or your connection.' }); }
  listen();
  sync();
  setInterval(function(){ if(!document.hidden && !store.chain.pending) sync() },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) sync() });
  document.addEventListener('change',function(e){ var t=e.target; if(t&&t.dataset&&t.dataset.recfile) pickFile(t.dataset.recfile,t); });
})();
</script>

</body></html>
